services:
  - type: web
    name: safehaven-backend
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy --schema=./prisma/schema.prisma
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000 